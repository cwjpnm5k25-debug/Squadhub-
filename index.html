<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquadHub - Chat Online Realtime</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            dark: '#0b0f19',
                            card: '#111827',
                            glass: 'rgba(17, 24, 39, 0.75)'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(11, 15, 25, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans h-screen overflow-hidden flex flex-col relative select-none">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-brand-dark z-50 flex flex-col items-center justify-center gap-4">
        <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-indigo-400 font-semibold animate-pulse">Connexion aux serveurs de chat...</p>
    </div>

    <!-- Main App Container -->
    <div id="app" class="hidden flex-1 flex h-full p-2 sm:p-4 gap-3 max-w-[1700px] w-full mx-auto overflow-hidden">

        <!-- SIDEBAR: Salons & Potes -->
        <aside id="sidebar" class="w-72 md:w-80 flex-shrink-0 glass-panel rounded-2xl flex flex-col transition-all duration-300 z-30 absolute md:relative inset-y-2 left-2 md:left-0 -translate-x-[110%] md:translate-x-0">
            <!-- Header Server / App -->
            <div class="p-4 border-b border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                        <i data-lucide="messages-square" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg tracking-wide bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">SquadHub</h1>
                        <p id="online-count-badge" class="text-xs text-emerald-400 flex items-center gap-1.5 font-medium">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>1 potes connectés</span>
                        </p>
                    </div>
                </div>
                <button id="close-sidebar-btn" class="md:hidden text-slate-400 hover:text-white p-2">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- List of Channels & Friends -->
            <div class="flex-1 overflow-y-auto p-3 space-y-6">
                <!-- Channels -->
                <div>
                    <div class="flex items-center justify-between px-3 mb-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
                        <span>Salons en direct</span>
                        <button onclick="openModal('create-channel-modal')" class="hover:text-indigo-400 transition" title="Créer un salon">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div id="channels-list" class="space-y-1">
                        <!-- Dynamic Channels -->
                    </div>
                </div>

                <!-- Active Users -->
                <div>
                    <div class="px-3 mb-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
                        Potes actifs sur Firestore
                    </div>
                    <div id="users-online-list" class="space-y-1.5">
                        <!-- Dynamic Users -->
                    </div>
                </div>
            </div>

            <!-- User Profile Footer -->
            <div class="p-3 border-t border-white/10 bg-slate-900/60 rounded-b-2xl">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition" onclick="openModal('profile-modal')">
                        <div id="user-avatar-display" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-lg font-bold text-white shadow-md">
                            🚀
                        </div>
                        <div class="overflow-hidden">
                            <h4 id="user-name-display" class="font-semibold text-sm truncate text-slate-100">Pote_En_Ligne</h4>
                            <p id="user-status-display" class="text-xs text-emerald-400 truncate">En ligne</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="toggleSound()" id="sound-btn" class="p-2 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-white/5 transition" title="Activer/Désactiver le son">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                        </button>
                        <button onclick="openModal('profile-modal')" class="p-2 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-white/5 transition" title="Profil">
                            <i data-lucide="settings" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT PANEL -->
        <main class="flex-1 glass-panel rounded-2xl flex flex-col relative overflow-hidden">
            <!-- Chat Header -->
            <header class="p-3 sm:p-4 border-b border-white/10 flex items-center justify-between bg-slate-900/50">
                <div class="flex items-center gap-3">
                    <button id="open-sidebar-btn" class="md:hidden text-slate-300 hover:text-white p-2 rounded-lg bg-white/5">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div class="flex items-center gap-2">
                        <span id="current-channel-icon" class="text-indigo-400 text-xl font-bold">#</span>
                        <h2 id="current-channel-name" class="font-bold text-lg text-slate-100">general</h2>
                    </div>
                    <span id="current-channel-desc" class="hidden sm:inline-block text-xs text-slate-400 border-l border-white/10 pl-3 py-1">
                        Discutez en direct sur le web
                    </span>
                </div>

                <!-- Actions Header -->
                <div class="flex items-center gap-2">
                    <button onclick="shareChannelLink()" class="px-3 py-1.5 bg-indigo-600/30 border border-indigo-500/40 hover:bg-indigo-600/50 text-indigo-200 text-xs font-semibold rounded-lg transition flex items-center gap-1.5" title="Inviter des potes">
                        <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Inviter</span>
                    </button>
                    <button onclick="openModal('poll-modal')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-lg shadow-md transition flex items-center gap-1.5">
                        <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Sondage</span>
                    </button>
                </div>
            </header>

            <!-- Messages Stream -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Messages dynamic loading -->
            </div>

            <!-- Typing Indicator -->
            <div id="typing-indicator" class="px-6 py-1 h-6 text-xs text-indigo-300 font-medium flex items-center gap-2 opacity-0 transition-opacity">
                <span id="typing-user-text">Quelqu'un écrit...</span>
                <div class="flex gap-1 items-center">
                    <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></span>
                    <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></span>
                    <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full typing-dot"></span>
                </div>
            </div>

            <!-- Input Bar -->
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="p-3 sm:p-4 bg-slate-900/80 border-t border-white/10 flex items-center gap-2 relative">
                <!-- Quick Image / GIF Link Trigger -->
                <button type="button" onclick="openModal('image-modal')" class="p-2.5 text-slate-400 hover:text-indigo-400 rounded-xl hover:bg-white/5 transition" title="Joindre une image/GIF">
                    <i data-lucide="image" class="w-5 h-5"></i>
                </button>

                <!-- Message Field -->
                <div class="flex-1 relative">
                    <input type="text" id="message-input" placeholder="Ton message... (/roll ou /flip pour jouer)"
                        oninput="handleTypingNotification()"
                        class="w-full glass-card rounded-xl py-2.5 pl-4 pr-10 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                    <button type="button" onclick="toggleEmojiPicker()" class="absolute right-3 top-2.5 text-slate-400 hover:text-amber-400 transition">
                        <i data-lucide="smile" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="p-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl shadow-lg shadow-indigo-600/30 transition">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>

                <!-- Quick Emoji Picker Popup -->
                <div id="emoji-picker" class="hidden absolute right-14 bottom-16 bg-slate-900 border border-white/10 rounded-2xl p-3 shadow-2xl z-40 w-64 grid grid-cols-6 gap-2 text-xl max-h-48 overflow-y-auto">
                    <!-- Dynamic Emojis -->
                </div>
            </form>
        </main>
    </div>

    <!-- MODAL: Profil -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-white/10">
            <h3 class="text-xl font-bold mb-4 text-slate-100 flex items-center gap-2">
                <i data-lucide="user-cog" class="text-indigo-400"></i> Ton Profil
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Pseudo</label>
                    <input type="text" id="profile-name-input" class="w-full glass-card rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Avatar Emoji</label>
                    <div id="avatar-picker" class="flex gap-2 overflow-x-auto pb-2 text-2xl">
                        <!-- Dynamic Avatars -->
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('profile-modal')" class="px-4 py-2 text-slate-400 hover:text-white text-sm">Annuler</button>
                <button onclick="saveUserProfile()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Créer Salon -->
    <div id="create-channel-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-white/10">
            <h3 class="text-xl font-bold mb-4 text-slate-100 flex items-center gap-2">
                <i data-lucide="hash" class="text-indigo-400"></i> Créer un nouveau salon
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nom du Salon</label>
                    <input type="text" id="new-channel-name" placeholder="ex: soirées-jeux" class="w-full glass-card rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Icône / Emoji</label>
                    <input type="text" id="new-channel-icon" placeholder="🎮" class="w-full glass-card rounded-xl p-2.5 text-sm">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('create-channel-modal')" class="px-4 py-2 text-slate-400 hover:text-white text-sm">Annuler</button>
                <button onclick="createChannel()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30">Créer</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Sondage -->
    <div id="poll-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-white/10">
            <h3 class="text-xl font-bold mb-4 text-slate-100 flex items-center gap-2">
                <i data-lucide="bar-chart-2" class="text-purple-400"></i> Nouveau Sondage
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Question</label>
                    <input type="text" id="poll-question-input" placeholder="ex: On joue à quoi ce soir ?" class="w-full glass-card rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Options (séparées par des virgules)</label>
                    <input type="text" id="poll-options-input" placeholder="Valorant, Rocket League, Minecraft" class="w-full glass-card rounded-xl p-2.5 text-sm">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('poll-modal')" class="px-4 py-2 text-slate-400 hover:text-white text-sm">Annuler</button>
                <button onclick="createPoll()" class="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-purple-600/30">Publier</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Image / GIF Link -->
    <div id="image-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-white/10">
            <h3 class="text-xl font-bold mb-4 text-slate-100 flex items-center gap-2">
                <i data-lucide="image" class="text-indigo-400"></i> Partager une image / GIF
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Lien URL direct de l'image / GIF</label>
                    <input type="url" id="image-url-input" placeholder="https://media.giphy.com/media/.../giphy.gif" class="w-full glass-card rounded-xl p-2.5 text-sm">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('image-modal')" class="px-4 py-2 text-slate-400 hover:text-white text-sm">Annuler</button>
                <button onclick="sendImageMessage()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30">Envoyer</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE MODULES IMPORT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, updateDoc, arrayUnion, arrayRemove, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global App Config
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'squadhub-chat-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo" };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App States
        let currentUser = null;
        let activeChannelId = 'general';
        let soundEnabled = true;
        let typingTimeout = null;
        let messageUnsubscribe = null;

        const EMOJIS = ['👍', '❤️', '🔥', '😂', '🎉', '😎', '🙌', '👀', '🚀', '💯', '💀', '🤡'];
        const AVATARS = ['🚀', '🦊', '🐱', '🐺', '🦁', '🤖', '👾', '⚡', '👑'];

        // Firestore Paths (Strict Rule 1 Compliance)
        const getPublicCollectionPath = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);
        const getPublicDocPath = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

        // --- AUTH & SETUP ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Exception:", err);
                // Fallback to anonymous
                await signInAnonymously(auth);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            
            // Build current user profile state
            const randomAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
            const randomName = 'Pote_' + Math.floor(Math.random() * 899 + 100);

            currentUser = {
                uid: user.uid,
                displayName: user.displayName || randomName,
                avatar: user.photoURL || randomAvatar,
                color: '#818cf8'
            };

            // Register presence on Firestore
            await registerPresence();

            // Hide loader and show UI
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');

            // Render static elements
            renderUserProfile();
            renderEmojiPicker();
            renderAvatarPicker();
            lucide.createIcons();

            // Check URL for channel param
            const urlParams = new URLSearchParams(window.location.search);
            const channelParam = urlParams.get('channel');
            if (channelParam) activeChannelId = channelParam;

            // Start Listeners
            listenToChannels();
            listenToOnlineUsers();
            switchChannel(activeChannelId);
        });

        async function registerPresence() {
            if (!currentUser) return;
            const userRef = getPublicDocPath('users', currentUser.uid);
            await setDoc(userRef, {
                uid: currentUser.uid,
                name: currentUser.displayName,
                avatar: currentUser.avatar,
                lastActive: serverTimestamp(),
                status: 'online'
            }, { merge: true });
        }

        // --- AUDIO FEEDBACK ---
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'receive') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                } else {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                }
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        window.toggleSound = function() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = soundEnabled ? '<i data-lucide="volume-2" class="w-4 h-4"></i>' : '<i data-lucide="volume-x" class="w-4 h-4"></i>';
            lucide.createIcons();
        };

        // --- CHANNELS REALTIME ---
        function listenToChannels() {
            onSnapshot(getPublicCollectionPath('channels'), (snapshot) => {
                let channels = [];
                snapshot.forEach(doc => channels.push({ id: doc.id, ...doc.data() }));

                // Default Channels if empty
                if (channels.length === 0) {
                    createDefaultChannels();
                    return;
                }

                renderChannelsList(channels);
            }, (error) => console.error("Channels Listener Error:", error));
        }

        async function createDefaultChannels() {
            const defaults = [
                { name: 'general', icon: '💬', desc: 'Salon principal pour parler entre potes !' },
                { name: 'gaming', icon: '🎮', desc: 'Sons, clips et rendez-vous gaming.' },
                { name: 'musique', icon: '🎵', desc: 'Partagez vos meilleurs sons.' }
            ];
            for (const ch of defaults) {
                await setDoc(getPublicDocPath('channels', ch.name), ch);
            }
        }

        function renderChannelsList(channels) {
            const container = document.getElementById('channels-list');
            container.innerHTML = '';

            channels.forEach(ch => {
                const isActive = ch.id === activeChannelId;
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${
                    isActive 
                    ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md shadow-indigo-500/20' 
                    : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'
                }`;
                btn.onclick = () => switchChannel(ch.id, ch.name, ch.icon, ch.desc);
                btn.innerHTML = `
                    <span class="text-base">${ch.icon || '💬'}</span>
                    <span class="truncate flex-1 text-left"># ${ch.name}</span>
                `;
                container.appendChild(btn);
            });
        }

        window.switchChannel = function(id, name, icon, desc) {
            activeChannelId = id;
            document.getElementById('current-channel-name').innerText = name || id;
            document.getElementById('current-channel-icon').innerText = icon || '#';
            if (desc) document.getElementById('current-channel-desc').innerText = desc;

            // Unsubscribe old messages listener
            if (messageUnsubscribe) messageUnsubscribe();

            // Listen to messages for current channel
            listenToMessages();
            document.getElementById('sidebar').classList.add('-translate-x-[110%]');
        };

        window.createChannel = async function() {
            const nameInput = document.getElementById('new-channel-name');
            const iconInput = document.getElementById('new-channel-icon');

            const name = nameInput.value.trim().toLowerCase().replace(/\s+/g, '-');
            if (!name) return;

            const icon = iconInput.value.trim() || '💬';
            await setDoc(getPublicDocPath('channels', name), { name, icon, desc: 'Salon communautaire' });

            nameInput.value = '';
            iconInput.value = '';
            closeModal('create-channel-modal');
            switchChannel(name, name, icon);
        };

        // --- MESSAGES REALTIME (RULE 2: Memory filter & sort) ---
        function listenToMessages() {
            const messagesRef = getPublicCollectionPath('messages');
            
            messageUnsubscribe = onSnapshot(messagesRef, (snapshot) => {
                let msgs = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.channelId === activeChannelId) {
                        msgs.push({ id: doc.id, ...data });
                    }
                });

                // In-memory sort by timestamp
                msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

                renderMessages(msgs);
            }, (error) => console.error("Messages Listener Error:", error));
        }

        function renderMessages(msgs) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            if (msgs.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-500">
                        <div class="w-12 h-12 rounded-full bg-indigo-500/10 flex items-center justify-center text-2xl mb-2 text-indigo-400">✨</div>
                        <p class="text-sm font-semibold text-slate-300">Aucun message pour l'instant</p>
                        <p class="text-xs">Sois le premier à saluer la bande !</p>
                    </div>
                `;
                return;
            }

            let playedSound = false;

            msgs.forEach(msg => {
                const isMe = msg.senderId === currentUser.uid;
                const msgEl = document.createElement('div');
                msgEl.className = `flex gap-3 group ${isMe ? 'flex-row-reverse' : ''}`;

                // Process Content Formatting
                let contentHTML = escapeHTML(msg.content)
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="text-indigo-400 underline hover:text-indigo-300">$1</a>');

                // Media Attachment
                let mediaHTML = '';
                if (msg.imageUrl) {
                    mediaHTML = `
                        <div class="mt-2 rounded-xl overflow-hidden max-w-xs border border-white/10 shadow-lg">
                            <img src="${msg.imageUrl}" class="w-full h-auto object-cover max-h-60" loading="lazy">
                        </div>
                    `;
                }

                // Poll Attachment
                let pollHTML = '';
                if (msg.poll) {
                    pollHTML = renderPollMarkup(msg);
                }

                // Reactions
                let reactionsHTML = renderReactionsMarkup(msg);

                const timeStr = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';

                msgEl.innerHTML = `
                    <div class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-base shadow-md border border-white/10 flex-shrink-0">
                        ${msg.senderAvatar || '👤'}
                    </div>
                    <div class="max-w-[80%] sm:max-w-[70%]">
                        <div class="flex items-center gap-2 mb-1 text-xs ${isMe ? 'justify-end' : ''}">
                            <span class="font-semibold text-indigo-300">${escapeHTML(msg.senderName)}</span>
                            <span class="text-[10px] text-slate-500">${timeStr}</span>
                        </div>
                        <div class="relative group/bubble p-3 rounded-2xl text-sm ${
                            isMe 
                            ? 'bg-gradient-to-br from-indigo-600 to-purple-600 text-white rounded-tr-none shadow-lg' 
                            : 'glass-card text-slate-100 rounded-tl-none border border-white/10'
                        }">
                            <div>${contentHTML}</div>
                            ${mediaHTML}
                            ${pollHTML}

                            <!-- Quick Reaction Overlay -->
                            <div class="absolute top-1 ${isMe ? 'left-1 -translate-x-full pr-2' : 'right-1 translate-x-full pl-2'} opacity-0 group-hover/bubble:opacity-100 transition flex items-center gap-1">
                                <button onclick="addReaction('${msg.id}', '❤️')" class="p-1 text-slate-400 hover:text-red-400 bg-slate-900 rounded-lg border border-white/10">❤️</button>
                                <button onclick="addReaction('${msg.id}', '🔥')" class="p-1 text-slate-400 hover:text-amber-400 bg-slate-900 rounded-lg border border-white/10">🔥</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1 mt-1 ${isMe ? 'justify-end' : ''}">
                            ${reactionsHTML}
                        </div>
                    </div>
                `;

                container.appendChild(msgEl);
            });

            container.scrollTop = container.scrollHeight;
        }

        // --- SEND MESSAGE & COMMANDS ---
        window.handleSendMessage = async function(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            let content = input.value.trim();

            if (!content) return;

            // Mini Commands
            if (content.startsWith('/roll')) {
                const max = parseInt(content.split(' ')[1]) || 100;
                const roll = Math.floor(Math.random() * max) + 1;
                content = `🎲 **Dé lancé** : Obtient un **${roll}** sur ${max} !`;
            } else if (content.startsWith('/flip')) {
                const res = Math.random() < 0.5 ? 'Pile 🪙' : 'Face 🪙';
                content = `🪙 **Pièce lancée** : Résultat -> **${res}** !`;
            }

            input.value = '';

            await addDoc(getPublicCollectionPath('messages'), {
                channelId: activeChannelId,
                senderId: currentUser.uid,
                senderName: currentUser.displayName,
                senderAvatar: currentUser.avatar,
                content: content,
                createdAt: Date.now(),
                reactions: {}
            });

            playSound('send');
        };

        window.sendImageMessage = async function() {
            const urlInput = document.getElementById('image-url-input');
            const url = urlInput.value.trim();
            if (!url) return;

            await addDoc(getPublicCollectionPath('messages'), {
                channelId: activeChannelId,
                senderId: currentUser.uid,
                senderName: currentUser.displayName,
                senderAvatar: currentUser.avatar,
                content: "Image partagée :",
                imageUrl: url,
                createdAt: Date.now(),
                reactions: {}
            });

            urlInput.value = '';
            closeModal('image-modal');
            playSound('send');
        };

        // --- POLLS ---
        window.createPoll = async function() {
            const qInput = document.getElementById('poll-question-input');
            const oInput = document.getElementById('poll-options-input');

            const question = qInput.value.trim();
            const rawOpts = oInput.value.trim();

            if (!question || !rawOpts) return;

            const options = rawOpts.split(',').map(o => o.trim()).filter(o => o.length > 0);
            if (options.length < 2) return;

            const pollData = {
                question: question,
                options: options.map(opt => ({ text: opt, votes: [] }))
            };

            await addDoc(getPublicCollectionPath('messages'), {
                channelId: activeChannelId,
                senderId: currentUser.uid,
                senderName: currentUser.displayName,
                senderAvatar: currentUser.avatar,
                content: `📊 **Sondage :** ${question}`,
                poll: pollData,
                createdAt: Date.now(),
                reactions: {}
            });

            qInput.value = '';
            oInput.value = '';
            closeModal('poll-modal');
            playSound('send');
        };

        window.votePoll = async function(messageId, optionIndex) {
            const msgRef = getPublicDocPath('messages', messageId);
            const snapshot = await getDoc(msgRef);
            if (!snapshot.exists()) return;

            const msgData = snapshot.data();
            if (!msgData.poll) return;

            let poll = msgData.poll;
            poll.options.forEach(opt => {
                const idx = opt.votes.indexOf(currentUser.uid);
                if (idx > -1) opt.votes.splice(idx, 1);
            });

            poll.options[optionIndex].votes.push(currentUser.uid);
            await updateDoc(msgRef, { poll: poll });
            playSound('send');
        };

        function renderPollMarkup(msg) {
            const poll = msg.poll;
            let totalVotes = 0;
            poll.options.forEach(o => totalVotes += o.votes.length);

            let html = `<div class="mt-3 p-3 rounded-xl bg-slate-900/80 border border-white/10 space-y-2">`;
            poll.options.forEach((opt, idx) => {
                const count = opt.votes.length;
                const percentage = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                const hasVoted = opt.votes.includes(currentUser.uid);

                html += `
                    <div onclick="votePoll('${msg.id}', ${idx})" class="cursor-pointer relative overflow-hidden rounded-lg p-2 border transition ${hasVoted ? 'border-indigo-500 bg-indigo-500/20' : 'border-white/5 bg-slate-800/50 hover:border-white/20'}">
                        <div class="absolute inset-0 bg-indigo-600/30 transition-all" style="width: ${percentage}%"></div>
                        <div class="relative flex justify-between items-center text-xs">
                            <span class="font-medium text-slate-200">${escapeHTML(opt.text)} ${hasVoted ? '✓' : ''}</span>
                            <span class="text-slate-400 font-bold">${percentage}% (${count})</span>
                        </div>
                    </div>
                `;
            });
            html += `<p class="text-[10px] text-slate-400 text-right">${totalVotes} vote(s)</p></div>`;
            return html;
        }

        // --- REACTIONS ---
        window.addReaction = async function(messageId, emoji) {
            const msgRef = getPublicDocPath('messages', messageId);
            const snapshot = await getDoc(msgRef);
            if (!snapshot.exists()) return;

            const data = snapshot.data();
            let reactions = data.reactions || {};

            if (!reactions[emoji]) reactions[emoji] = [];
            const userIndex = reactions[emoji].indexOf(currentUser.uid);

            if (userIndex > -1) {
                reactions[emoji].splice(userIndex, 1);
                if (reactions[emoji].length === 0) delete reactions[emoji];
            } else {
                reactions[emoji].push(currentUser.uid);
            }

            await updateDoc(msgRef, { reactions: reactions });
            playSound('send');
        };

        function renderReactionsMarkup(msg) {
            if (!msg.reactions || Object.keys(msg.reactions).length === 0) return '';
            let html = '';
            for (const [emoji, users] of Object.entries(msg.reactions)) {
                if (users.length === 0) continue;
                const hasReacted = users.includes(currentUser.uid);
                html += `
                    <button onclick="addReaction('${msg.id}', '${emoji}')" class="px-2 py-0.5 rounded-full text-xs flex items-center gap-1 border transition ${
                        hasReacted ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'bg-slate-800 border-white/10 text-slate-400'
                    }">
                        <span>${emoji}</span>
                        <span class="font-bold">${users.length}</span>
                    </button>
                `;
            }
            return html;
        }

        // --- ONLINE USERS REALTIME ---
        function listenToOnlineUsers() {
            onSnapshot(getPublicCollectionPath('users'), (snapshot) => {
                const container = document.getElementById('users-online-list');
                const badge = document.getElementById('online-count-badge');
                container.innerHTML = '';

                let count = 0;
                snapshot.forEach(doc => {
                    count++;
                    const user = doc.data();
                    const isMe = user.uid === currentUser.uid;

                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-2.5 p-2 rounded-xl hover:bg-white/5 transition';
                    item.innerHTML = `
                        <div class="relative">
                            <span class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-sm">${user.avatar || '👤'}</span>
                            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 border border-slate-900"></span>
                        </div>
                        <span class="text-xs font-medium text-slate-200 truncate">${escapeHTML(user.name)} ${isMe ? '(Toi)' : ''}</span>
                    `;
                    container.appendChild(item);
                });

                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>${count} potes connectés</span>`;
            }, (error) => console.error("Users Listener Error:", error));
        }

        // --- USER PROFILE & HELPERS ---
        function renderUserProfile() {
            document.getElementById('user-name-display').innerText = currentUser.displayName;
            document.getElementById('user-avatar-display').innerText = currentUser.avatar;
            document.getElementById('profile-name-input').value = currentUser.displayName;
        }

        function renderAvatarPicker() {
            const container = document.getElementById('avatar-picker');
            container.innerHTML = '';
            AVATARS.forEach(av => {
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-xl hover:bg-white/10 transition border ${currentUser.avatar === av ? 'border-indigo-500 bg-indigo-500/20' : 'border-transparent'}`;
                btn.innerText = av;
                btn.onclick = () => {
                    currentUser.avatar = av;
                    renderAvatarPicker();
                };
                container.appendChild(btn);
            });
        }

        window.saveUserProfile = async function() {
            const newName = document.getElementById('profile-name-input').value.trim();
            if (newName) currentUser.displayName = newName;

            renderUserProfile();
            await registerPresence();
            closeModal('profile-modal');
        };

        function renderEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            picker.innerHTML = '';
            EMOJIS.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'hover:bg-white/10 p-1.5 rounded-lg transition text-center';
                btn.innerText = emoji;
                btn.onclick = () => {
                    const input = document.getElementById('message-input');
                    input.value += emoji;
                    toggleEmojiPicker();
                    input.focus();
                };
                picker.appendChild(btn);
            });
        }

        window.toggleEmojiPicker = function() {
            document.getElementById('emoji-picker').classList.toggle('hidden');
        };

        window.openModal = function(id) { document.getElementById(id).classList.remove('hidden'); };
        window.closeModal = function(id) { document.getElementById(id).classList.add('hidden'); };

        window.shareChannelLink = function() {
            const shareUrl = `${window.location.origin}${window.location.pathname}?channel=${activeChannelId}`;
            const tempInput = document.createElement('input');
            document.body.appendChild(tempInput);
            tempInput.value = shareUrl;
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            alert(`Lien du salon #${activeChannelId} copié ! Envoie-le à tes potes pour qu'ils te rejoignent.`);
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // Initialize Auth
        initAuth();

        // Responsive Sidebar Events
        document.getElementById('open-sidebar-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('-translate-x-[110%]');
        });
        document.getElementById('close-sidebar-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('-translate-x-[110%]');
        });
    </script>
</body>
</html>
